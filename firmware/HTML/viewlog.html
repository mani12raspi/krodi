<!DOCTYPE HTML>
<html>
  <head>
    <title>Krodi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
  </head>
  <body>
    <div id="global-toast" class="toast-container"></div>

    <nav id="menu">
      <input type="checkbox" id="responsive-menu">
      <label for="responsive-menu"></label>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/txconfig">Transmitter</a></li>
        <li><a href="/rxconfig">Receiver</a></li>
        <li><a href="/viewlog">Log Viewer</a></li>
        <li><a href="/btjammer">BT Jammer</a></li>
        <li><a href="/config">Config</a></li>
      </ul>
    </nav>

    <div class="rf-logo">Log Viewer <span class="conn-dot"></span></div>

    <div class="view-container">
      <div id="logsContainer">
        <div id="logsText">Loading log...</div>
      </div>
      <div class="button-container" style="margin-top:12px;">
        <button type="button" class="button-danger" onclick="deleteLog()">Delete Log</button>
      </div>
    </div>

    <script>
async function loadLogs() {
try {
const response = await fetch('/logs?_=' + Date.now());
if (!response.ok) throw new Error('HTTP ' + response.status);
const text = await response.text();
const container = document.getElementById('logsContainer');
const logsText  = document.getElementById('logsText');
const display = text.trim().length > 0 ? text : '[ No log data yet ]';
if (logsText.textContent !== display) {
logsText.textContent = display;
container.scrollTop = container.scrollHeight;
}
} catch (error) {
document.getElementById('logsText').textContent = 'Error loading logs: ' + error;
}
}

function deleteLog() {
if (!confirm('Delete the log?')) return;
fetch('/delete', { method: 'POST' })
.then(r => {
if (!r.ok) throw new Error('Failed');
showMessage('success', 'Log deleted');
document.getElementById('logsText').textContent = '';
})
.catch(() => showMessage('error', 'Error deleting log'));
}

document.addEventListener('DOMContentLoaded', () => {
loadLogs();
setInterval(loadLogs, 5000);
});
    </script>
  </body>
</html>
