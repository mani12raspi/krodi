<!DOCTYPE HTML>
<html>
  <head>
    <title>Krodi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
    <style>
.rx-status-bar {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 14px;
border: 1px solid var(--border);
border-radius: 3px;
margin-bottom: 16px;
background: var(--bg3);
transition: border-color 0.3s;
}
.rx-status-bar.active {
border-color: #aaaaaa;
background: rgba(255,255,255,0.04);
animation: rx-pulse-border 1.4s ease-in-out infinite;
}
@keyframes rx-pulse-border {
0%,100% { border-color: #aaaaaa; box-shadow: none; }
50%      { border-color: #ffffff; box-shadow: 0 0 8px 2px rgba(200,200,200,0.2); }
}
.rx-dot {
width: 11px; height: 11px;
border-radius: 50%;
background: var(--border2);
flex-shrink: 0;
transition: background 0.3s, box-shadow 0.3s;
}
.rx-status-bar.active .rx-dot {
background: #cccccc;
box-shadow: 0 0 8px #cccccc;
animation: rx-dot-blink 1.1s ease-in-out infinite;
}
@keyframes rx-dot-blink {
0%,100% { opacity: 1; }
50%      { opacity: 0.35; }
}
.rx-label {
font-family: 'Rajdhani', sans-serif;
font-weight: 700;
font-size: 0.85em;
letter-spacing: 1.5px;
text-transform: uppercase;
color: var(--text-dim);
transition: color 0.3s;
}
.rx-status-bar.active .rx-label { color: #dddddd; }
.rx-status-text {
font-size: 12px;
color: var(--text-dim);
margin-left: auto;
transition: color 0.3s;
}
.rx-status-bar.active .rx-status-text { color: #bbbbbb; }

.log-panel-wrapper { margin-top: 20px; }

.log-panel-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
flex-wrap: wrap;
gap: 6px;
}
.log-panel-header .section-header { margin: 0; flex: 1; }

.log-header-actions {
display: flex;
gap: 6px;
flex-wrap: wrap;
}

.log-btn {
font-size: 11px;
padding: 4px 10px;
min-height: 28px;
margin: 0;
}
.log-btn-scroll {

}

#rxLogBox {
width: 100%;
height: 38vh;
background: #000;
color: #cccccc;
border: 1px solid var(--border);
border-radius: 3px;
padding: 10px 12px;
overflow-y: auto;
font-family: 'Share Tech Mono', monospace;
font-size: 12.5px;
white-space: pre-wrap;
word-wrap: break-word;
box-sizing: border-box;
scrollbar-width: thin;
scrollbar-color: var(--border2) #000;
}
#rxLogBox::-webkit-scrollbar { width: 6px; }
#rxLogBox::-webkit-scrollbar-track { background: #111; }
#rxLogBox::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.log-flash { animation: logFlash 0.4s ease-out; }
@keyframes logFlash {
0%   { border-color: #888; }
100% { border-color: var(--border); }
}

#logPollBadge {
font-family: 'Share Tech Mono', monospace;
font-size: 11px;
color: var(--text-dim);
align-self: center;
white-space: nowrap;
}
#logPollBadge.fast { color: #aaaaaa; }
    </style>
  </head>
  <body>
    <div id="global-toast" class="toast-container"></div>

    <nav id="menu">
      <input type="checkbox" id="responsive-menu">
      <label for="responsive-menu"></label>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/txconfig">Transmitter</a></li>
        <li><a href="/rxconfig">Receiver</a></li>
        <li><a href="/viewlog">Log Viewer</a></li>
        <li><a href="/btjammer">BT Jammer</a></li>
        <li><a href="/config">Config</a></li>
      </ul>
    </nav>

    <div class="rf-logo">Receiver Config <span class="conn-dot"></span></div>

    <div class="view-container">
      <form id="rxForm">

        <div class="rx-status-bar" id="rxStatusBar">
          <div class="rx-dot"></div>
          <span class="rx-label">Receiver</span>
          <span class="rx-status-text" id="rxStatusText">INACTIVE</span>
        </div>

        <div class="form-group">
          <label>Module</label>
          <select name="module" id="module" class="styled-select">
            <option value="1">Module 1</option>
            <option value="2">Module 2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Modulation</label>
          <select name="mod" id="mod" class="styled-select">
            <option value="0">2-FSK</option>
            <option value="2">ASK/OOK</option>
          </select>
        </div>

        <div class="form-group">
          <label>Frequency — Presets</label>
          <div class="freq-presets" id="rxFreqPresets">
            <button type="button" class="freq-chip" data-freq="315">315 MHz</button>
            <button type="button" class="freq-chip" data-freq="433.92">433.92 MHz</button>
            <button type="button" class="freq-chip" data-freq="868.35">868.35 MHz</button>
            <button type="button" class="freq-chip" data-freq="915">915 MHz</button>
          </div>
          <input type="text" name="frequency" id="frequency" class="single-line-input"
          placeholder="Or type a frequency (MHz)">
        </div>

        <div class="form-group">
          <label>RX Bandwidth</label>
          <input type="text" name="setrxbw" id="setrxbw" class="single-line-input"
          placeholder="RX bandwidth" value="200">
        </div>

        <div class="form-group">
          <label>Deviation</label>
          <input type="text" name="deviation" id="deviation" class="single-line-input"
          placeholder="Deviation" value="0">
        </div>

        <div class="form-group">
          <label>Data Rate</label>
          <input type="text" name="datarate" id="datarate" class="single-line-input"
          placeholder="Data rate" value="5">
        </div>

        <input type="radio" name="configmodule" value="4" hidden checked>

        <div class="button-container">
          <button type="button" class="button-submit" id="startRxBtn" onclick="applyRX()">Start RX</button>
          <button type="button" class="button-stop"   id="stopRxBtn"  onclick="stopRX()">Stop RX</button>
        </div>
      </form>

      <hr>

      <div class="log-panel-wrapper">
        <div class="log-panel-header">
          <div class="section-header">Live Log</div>
          <span id="logPollBadge">IDLE&nbsp;·&nbsp;8 s</span>
          <div class="log-header-actions">
            <button type="button" class="log-btn log-btn-scroll" onclick="toggleAutoScroll()" id="scrollToggleBtn">
              Auto-scroll ON
            </button>
            <button type="button" class="log-btn button-danger" onclick="deleteLog()">Delete Log</button>
          </div>
        </div>
        <div id="rxLogBox"><span style="color:#555">Loading log...</span></div>
      </div>

    </div>

    <script>
const RX_FIELDS = [
{ id: 'module',    key: 'rx_module',    def: '1'   },
{ id: 'mod',       key: 'rx_mod',       def: '0'   },
{ id: 'frequency', key: 'rx_frequency', def: ''    },
{ id: 'setrxbw',   key: 'rx_bw',        def: '200' },
{ id: 'deviation', key: 'rx_deviation', def: '0'   },
{ id: 'datarate',  key: 'rx_datarate',  def: '5'   },
];

RX_FIELDS.forEach(f => bindField(document.getElementById(f.id), f.key, f.def));

const freqInput = document.getElementById('frequency');

document.querySelectorAll('#rxFreqPresets .freq-chip').forEach(chip => {
chip.addEventListener('click', function () {
document.querySelectorAll('#rxFreqPresets .freq-chip').forEach(c => c.classList.remove('selected'));
this.classList.add('selected');
freqInput.value = this.dataset.freq;
Store.save('rx_frequency', this.dataset.freq);
});
});

freqInput.addEventListener('input', () => {
document.querySelectorAll('#rxFreqPresets .freq-chip').forEach(c => c.classList.remove('selected'));
});

(function restoreChip() {
const saved = Store.load('rx_frequency', '');
document.querySelectorAll('#rxFreqPresets .freq-chip').forEach(c => {
if (c.dataset.freq === saved) c.classList.add('selected');
});
})();

function setRxStatus(active) {
const bar = document.getElementById('rxStatusBar');
const txt = document.getElementById('rxStatusText');
bar.classList.toggle('active', active);
txt.textContent = active ? 'ACTIVE' : 'INACTIVE';
}

setRxStatus(HW.isRx());

window.addEventListener('hw:idle', () => {
setRxStatus(false);
setSlowPoll();
});

async function applyRX() {
const freq = document.getElementById('frequency').value.trim();
if (!freq) { showMessage('error', 'Frequency is required'); return; }

showMessage('info', 'Resetting hardware before starting RX…');
setRxStatus(false);

try {
await fetch('/stopjammer', { method: 'POST' });
} catch (_) {  }

try {
await fetch('/stoprx', { method: 'POST' });
} catch (_) {  }

await new Promise(r => setTimeout(r, 50));

HW.state = 'idle';

const form = document.getElementById('rxForm');
const data = new URLSearchParams(new FormData(form));

try {
const response = await fetch('/setrx', {
method: 'POST',
headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
body: data
});
const result = await response.text();
if (response.ok) {
HW.state = 'rx';
setRxStatus(true);
setFastPoll();
showMessage('success', 'RX started — ' + freq + ' MHz');
} else {
showMessage('error', 'Error starting RX: ' + result);
}
} catch (error) {
showMessage('error', 'Error sending RX configuration');
console.error(error);
}
}

async function stopRX() {
try {
const response = await fetch('/stoprx', { method: 'POST' });
const data = await response.text();
if (response.ok) {
HW.state = 'idle';
setRxStatus(false);
setSlowPoll();
showMessage('success', 'RX stopped');
} else {
showMessage('error', 'Error stopping RX: ' + data);
}
} catch (error) {
showMessage('error', 'Error communicating with device');
console.error(error);
}
}

let logPollTimer  = null;
let lastLogText   = null;
let autoScroll    = true;
let currentRate   = 8000;

function updatePollBadge(fast) {
const badge = document.getElementById('logPollBadge');
badge.textContent = fast ? 'RX ACTIVE · 2 s' : 'IDLE · 8 s';
badge.classList.toggle('fast', fast);
}

function toggleAutoScroll() {
autoScroll = !autoScroll;
const btn = document.getElementById('scrollToggleBtn');
btn.textContent = autoScroll ? 'Auto-scroll ON' : 'Auto-scroll OFF';
}

async function pollLog() {
const box = document.getElementById('rxLogBox');
try {

const r = await fetch('/logs?_=' + Date.now());

if (!r.ok) {
const errMsg = 'Error loading logs: Failed to fetch logs (HTTP ' + r.status + ')';
if (lastLogText !== errMsg) { lastLogText = errMsg; box.textContent = errMsg; }
return;
}

const text = await r.text();

if (text === lastLogText) return;
lastLogText = text;

const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

if (text && text.trim().length > 0) {
box.textContent = text;
} else {
box.innerHTML = '<span style="color:#555">[ No data yet ]</span>';
}

if (autoScroll && nearBottom) box.scrollTop = box.scrollHeight;

box.classList.remove('log-flash');
void box.offsetWidth;
box.classList.add('log-flash');

} catch (e) {

const errMsg = 'Error loading logs: ' + e;
if (lastLogText !== errMsg) { lastLogText = errMsg; box.textContent = errMsg; }
}
}

function _clearPollTimer() {
if (logPollTimer) { clearInterval(logPollTimer); logPollTimer = null; }
}

function setFastPoll() {
if (currentRate === 2000) return;
currentRate = 2000;
_clearPollTimer();
pollLog();
logPollTimer = setInterval(pollLog, 2000);
updatePollBadge(true);
}

function setSlowPoll() {
if (currentRate === 8000) return;
currentRate = 8000;
_clearPollTimer();
logPollTimer = setInterval(pollLog, 8000);
updatePollBadge(false);
}

function deleteLog() {
if (!confirm('Delete the log file on the device?')) return;
fetch('/delete', { method: 'POST' })
.then(r => {
if (!r.ok) throw new Error('Failed');
lastLogText = '';
const box = document.getElementById('rxLogBox');
box.innerHTML = '<span style="color:#555">[ Log deleted ]</span>';
showMessage('success', 'Log deleted');
})
.catch(() => showMessage('error', 'Error deleting log'));
}

(function initLog() {
pollLog();

if (HW.isRx()) {

currentRate = 2000;
logPollTimer = setInterval(pollLog, 2000);
updatePollBadge(true);
} else {

currentRate = 8000;
logPollTimer = setInterval(pollLog, 8000);
updatePollBadge(false);
}
})();

window.addEventListener('beforeunload', () => {
_clearPollTimer();
});
    </script>
  </body>
</html>
