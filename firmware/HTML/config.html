<!DOCTYPE HTML>
<html>
  <head>
    <title>Krodi</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js"></script>
  </head>
  <body>
    <div id="global-toast" class="toast-container"></div>

    <nav id="menu">
      <input type="checkbox" id="responsive-menu">
      <label for="responsive-menu"></label>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/txconfig">Transmitter</a></li>
        <li><a href="/rxconfig">Receiver</a></li>
        <li><a href="/viewlog">Log Viewer</a></li>
        <li><a href="/btjammer">BT Jammer</a></li>
        <li><a href="/config">Config</a></li>
      </ul>
    </nav>

    <div class="rf-logo">Configuration <span class="conn-dot"></span></div>

    <div class="view-container">

      <form id="wifiForm">
        <div class="section-header">Wi-Fi</div>

        <div class="form-group">
          <label>SSID</label>
          <input type="text" id="ssid" name="ssid" required class="single-line-input" placeholder="Network name">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" name="password" required class="single-line-input" placeholder="Network password">
        </div>

        <div class="button-container">
          <button type="button" class="button-submit" onclick="applyWiFi()">Apply Wi-Fi</button>
          <button type="button" class="button-danger" onclick="deleteWiFiConfig()">Delete Wi-Fi Config</button>
        </div>
      </form>

      <hr>

      <div class="section-header">Device</div>
      <div class="config-buttons-container">
        <button type="button" onclick="clearCache()">Clear Cache</button>
        <button type="button" onclick="rebootDevice()">Reboot Device</button>
      </div>
      <p class="payload-desc">Clear Cache reloads CSS/JS files from device.</p>

    </div>

    <script>
function applyWiFi() {
const ssid = document.getElementById('ssid').value.trim();
const password = document.getElementById('password').value.trim();
if (!ssid || !password) { showMessage('error', 'SSID and password are required'); return; }
fetch('/updatewifi', {
method: 'POST',
headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
body: new URLSearchParams({ ssid, password })
})
.then(r => r.json())
.then(data => {
data.status === 'success'
? showMessage('success', data.message)
: showMessage('error', data.message);
})
.catch(() => showMessage('error', 'Error applying Wi-Fi settings'));
}

function deleteWiFiConfig() {
if (!confirm('Delete Wi-Fi configuration?')) return;
fetch('/deletewificonfig', { method: 'POST' })
.then(r => r.json())
.then(data => {
data.status === 'success'
? showMessage('success', data.message || 'Wi-Fi configuration deleted')
: showMessage('error', data.message || 'Error deleting Wi-Fi config');
})
.catch(e => showMessage('error', 'Error: ' + e.message));
}

function clearCache() {
document.querySelectorAll('link[rel="stylesheet"], script[src]').forEach(el => {
const url = new URL(el.href || el.src);
url.searchParams.set('nocache', Date.now());
if (el.href) el.href = url.toString();
else el.src = url.toString();
});
showMessage('success', 'Cache cleared — reloading...');
setTimeout(() => location.reload(true), 1000);
}

function rebootDevice() {
if (!confirm('Reboot the device?')) return;
showMessage('info', 'Rebooting... please wait');
fetch('/reboot', { method: 'POST' }).catch(() => {});
}
    </script>
  </body>
</html>
